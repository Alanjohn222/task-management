name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API build and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore tests/TaskManagement.Api.IntegrationTests/TaskManagement.Api.IntegrationTests.csproj
      - name: Build
        run: dotnet build tests/TaskManagement.Api.IntegrationTests/TaskManagement.Api.IntegrationTests.csproj --configuration Release --no-restore
      - name: Run integration tests
        run: >-
          dotnet test tests/TaskManagement.Api.IntegrationTests/TaskManagement.Api.IntegrationTests.csproj
          --configuration Release --no-build --no-restore
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  docker:
    name: API Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --tag task-management-api:ci .
